[project]
name = "widget-warehouse-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "vueda >=3.0.0,<4",
  "psycopg[binary] >=3.2.0,<4",
  "gunicorn >=26.0.0,<27",
  "pillow>=12.2.0",
]

[dependency-groups]
dev = [
  "ruff ==0.14.6",
  "pytest >=7.0.0,<9",
  "pytest-django >=4.0.0,<5",
]

[[tool.uv.index]]
name = "arrai"
url = "https://pypi.arrai.dev/simple/"
explicit = true

[tool.uv.sources]
vueda = { path = "../../vueda/server", editable = true }
