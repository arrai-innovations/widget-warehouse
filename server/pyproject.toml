[project]
name = "widget-warehouse-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "vueda >=3.0.0a2,<4",
  "psycopg[binary] >=3.2.0,<4",
  # Pinned to a git tag. The ASGI worker in 26.2.0, the newest release on PyPI, drops a
  # request pipelined on a kept-alive connection, so that connection hangs until the client
  # gives up. Django triggers it on ordinary traffic because it omits Content-Length, which
  # makes the worker frame responses chunked. Fixed upstream in 26.2.1 by benoitc/gunicorn#3727.
  # gunicorn uploads to PyPI by hand, and 26.2.1 and 26.2.2 are tagged but not uploaded, so no
  # released version carries the fix. Restore a version range once 26.2.2 or later lands there.
  "gunicorn @ git+https://github.com/benoitc/gunicorn@26.2.2",
  "redis >=7.4.0,<8",
  "pillow>=12.2.0",
]

[dependency-groups]
dev = [
  "ruff ==0.14.6",
  "coverage >=7.14.1",
  "pytest >=9.0.0,<10",
  "pytest-cov >=4.1.0",
  "pytest-django >=4.0.0,<5",
  "pytest-xdist >=3.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.coverage.run]
branch = true
# `parallel` and `multiprocessing` keep the per-worker data files apart under pytest-xdist,
# and match what the CI job's coverage step expects to combine.
parallel = true
concurrency = ["multiprocessing"]
source = ["./widget_warehouse"]
omit = [
    "*/migrations/*",
    "*tests*",
]

# The CI job uploads this directory from the repository root, not from server/.
[tool.coverage.html]
directory = "../htmlcov/"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
