[project]
name = "widget-warehouse-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "vueda >=3.0.0a2,<4",
  "psycopg[binary] >=3.2.0,<4",
  "gunicorn >=26.1.0,<27",
  "redis >=7.4.0,<8",
  "pillow>=12.2.0",
]

[dependency-groups]
dev = [
  "ruff ==0.14.6",
  "coverage >=7.14.1",
  "pytest >=9.0.0,<10",
  "pytest-cov >=4.1.0",
  "pytest-django >=4.0.0,<5",
  "pytest-xdist >=3.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.coverage.run]
branch = true
# `parallel` and `multiprocessing` keep the per-worker data files apart under pytest-xdist,
# and match what the CI job's coverage step expects to combine.
parallel = true
concurrency = ["multiprocessing"]
source = ["./widget_warehouse"]
omit = [
    "*/migrations/*",
    "*tests*",
]

# The CI job uploads this directory from the repository root, not from server/.
[tool.coverage.html]
directory = "../htmlcov/"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
