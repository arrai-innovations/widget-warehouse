# Shared config (safe to commit).
#
# These defaults target the public production domain. Override in config.local.toml or
# a deployment-specific config layer as needed.

ALLOWED_HOSTS = ["widgetwarehouse.com"]
TIME_ZONE = "UTC"

FRONTEND_DOMAIN = "https://widgetwarehouse.com"
FRONTEND_LOGIN_URL = "/login"

SITE_NAME = "Widget Warehouse"
SUPPORT_EMAIL = "support@widgetwarehouse.com"

AUTH_USER_MODEL = "users.User"
LOCAL_APPS = ["widget_warehouse.users"]

STATIC_ROOT = "/tmp/static"
STATICFILES_DIRS = []

CSRF_TRUSTED_ORIGINS = ["https://widgetwarehouse.com"]
CORS_ALLOWED_ORIGINS = ["https://widgetwarehouse.com"]

DATABASE_BACKUP_DIR = "/tmp/db-backups"
