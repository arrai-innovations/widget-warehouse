# Shared config (safe to commit).
#
# These are development defaults. Every deployment overrides what it needs in
# config.local.toml, including a developer's machine: local development is one
# more deployment of this project, not a special case. See
# config.local.toml.example for the keys a deployment supplies, with values
# shaped for the public production deployment.
#
# SECRET_KEY and DATABASE_URL are deliberately absent. Neither has a default in
# VUEDA, so a deployment that omits one fails at startup instead of running on a
# published key or migrating whichever database it happened to reach.

TIME_ZONE = "UTC"

SITE_NAME = "Widget Warehouse"
SUPPORT_EMAIL = "support@widgetwarehouse.com"

AUTH_USER_MODEL = "users.User"
LOCAL_APPS = ["widget_warehouse.users"]

FRONTEND_LOGIN_URL = "/login"

ALLOWED_HOSTS = ["localhost", "127.0.0.1"]
FRONTEND_DOMAIN = "http://localhost:8080"
CSRF_TRUSTED_ORIGINS = ["http://localhost:8080"]
CORS_ALLOWED_ORIGINS = ["http://localhost:8080"]

STATIC_ROOT = "/tmp/static"
STATICFILES_DIRS = []

DATABASE_BACKUP_DIR = "/tmp/db-backups"
