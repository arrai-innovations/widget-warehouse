version: 2.1

orbs:
    pytest: arrai/pytest@11.0.0
    vueda: arrai/vueda@1.1.1

# Both parameters are declared in both continued configs. A change touching client/ and
# server/ together merges the two files into one configuration, and an undeclared parameter
# referenced by the other half would fail that pipeline.
parameters:
    run-client-workflows:
        type: boolean
        default: false
    run-server-workflows:
        type: boolean
        default: false
    # Set on the pipeline by scripts/redeploy.py. Parameters set at trigger time reach this
    # config on their own, so they are declared here to be read, not passed by the setup
    # config's continuation.
    redeploy-server:
        type: boolean
        default: false
    redeploy-client:
        type: boolean
        default: false
    redeploy-tag:
        type: string
        default: ""

executors:
    server-python311-pg:
        docker:
            - image: cimg/python:3.11
            - image: cimg/postgres:15.12
            # Every settings module points the cache at Valkey through Django's Redis
            # backend. No test exercises the cache yet, and the backend connects lazily,
            # so the suite passes without this image today. It is here so the first test
            # that does touch the cache or a cached session behaves in CI the way it does
            # on a developer's machine, rather than failing only here.
            - image: cimg/redis:7.2.4
    # The deploy command installs semver from npm before it posts, so a redeploy runs on
    # node rather than on the Python image the suite uses.
    server-node-lts:
        docker:
            - image: cimg/node:lts

jobs:
    # A release gets CIRCLE_TAG from the tag that started the pipeline. A redeploy runs on
    # main and carries the tag as a parameter instead, so it has to put the tag in the
    # environment itself before the orb's deploy command reads it.
    server-redeploy:
        executor: server-node-lts
        resource_class: small
        circleci_ip_ranges: true
        steps:
            - run:
                  name: Set the tag to redeploy
                  command: |
                      tag="<< pipeline.parameters.redeploy-tag >>"
                      if [ -z "$tag" ]; then
                          echo "This pipeline carries no redeploy-tag."
                          echo "Trigger a redeploy with: just redeploy <tag>"
                          exit 1
                      fi
                      echo "export CIRCLE_TAG='$tag'" >> "$BASH_ENV"
            # A tag deploy reads nothing from the working tree, and this checks out main
            # rather than the tag. It is here because the deploy command documents a
            # checkout as its precondition.
            - checkout
            - vueda/deploy:
                  deploy_url: "https://www.widgetwarehouse.com/deploy/server"
                  deploy_to: "Production"
                  deploy_type: tag

workflows:
    server-test-and-deploy:
        unless: << pipeline.parameters.redeploy-server >>
        jobs:
            - pytest/pytest:
                  name: server-pytest
                  executor: server-python311-pg
                  context: arrai-global
                  wd: server
                  pytest_args: "--cov -n2 --dist loadgroup"
                  # The coverage report prints into the build log. Publishing it, and the
                  # badges, waits on an ssh key for the artifacts host: rsync silently does
                  # nothing when ~/.ssh/config has no matching entry, so turning these on
                  # early would look like it worked.
                  create_status_badge: false
                  create_coverage_badge: false
                  build_coverage: false
                  config:
                      - run:
                            name: Configure tests
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            # Checks out the tag on the server and runs update.sh there, which installs from
            # the lockfile, collects static files, and migrates. The tag is the only payload,
            # signed with DEPLOYER_KEY, a project environment variable.
            - vueda/deploy:
                  name: server-deploy-production
                  requires:
                      - server-pytest
                  # The apex host redirects to www, and wget reissues a redirected POST as a GET,
                  # dropping the signed body. Naming the canonical host keeps the request intact.
                  deploy_url: "https://www.widgetwarehouse.com/deploy/server"
                  deploy_to: "Production"
                  deploy_type: tag
                  filters:
                      tags:
                          only: /^server-v.*/
                      branches:
                          ignore: /.*/

    # Sends a tag that is already tested and released to the deployer again. DEPLOYER_KEY is
    # a project environment variable, so this needs no context.
    server-redeploy:
        when: << pipeline.parameters.redeploy-server >>
        jobs:
            - server-redeploy:
                  name: server-redeploy-production
